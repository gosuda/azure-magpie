name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Unit Tests
        run: bun test

      - name: Build Pages Bundle
        run: bun run build.ts

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create azure-magpie --production-branch=main 2>/dev/null || true

      - name: Sync GitHub App Secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          MAGPIE_APP_ID: ${{ secrets.MAGPIE_APP_ID || vars.MAGPIE_APP_ID || secrets.CAPY_APP_ID || vars.CAPY_APP_ID }}
          MAGPIE_INSTALLATION_ID: ${{ secrets.MAGPIE_INSTALLATION_ID || vars.MAGPIE_INSTALLATION_ID || secrets.CAPY_INSTALLATION_ID || vars.CAPY_INSTALLATION_ID }}
          MAGPIE_APP_PRIVATE_KEY: ${{ secrets.MAGPIE_APP_PRIVATE_KEY || secrets.CAPY_APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.SUDA_MIRROR_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/worker-secrets.json
          import json, os
          secrets = {}
          for key in ("MAGPIE_APP_ID", "MAGPIE_INSTALLATION_ID", "MAGPIE_APP_PRIVATE_KEY", "WEBHOOK_SECRET"):
              val = os.environ.get(key, "").strip()
              if val:
                  secrets[key] = val
          if "MAGPIE_APP_PRIVATE_KEY" not in secrets and os.environ.get("GITHUB_TOKEN_FALLBACK", "").strip():
              secrets["GITHUB_TOKEN"] = os.environ["GITHUB_TOKEN_FALLBACK"].strip()
          print(json.dumps(secrets))
          PY
          if [ "$(jq 'length' /tmp/worker-secrets.json)" -gt 0 ]; then
            npx wrangler pages secret bulk /tmp/worker-secrets.json --project-name=azure-magpie
          fi
          rm -f /tmp/worker-secrets.json

      - name: Deploy Bundle to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name=azure-magpie --branch=main
