name: Suda Monorepo Land and Sync

on:
  repository_dispatch:
    types:
      - suda-land
      - capy-inbound
  workflow_dispatch:
    inputs:
      action_type:
        description: "Operation type (suda-land or capy-inbound)"
        required: true
        default: "suda-land"
      land_ref:
        description: "Landing branch reference (for example: refs/heads/land/e2e-sync)"
        required: false
      workflow:
        description: "Mirror workflow name for capy-inbound"
        required: false
      ref:
        description: "External ref for capy-inbound"
        required: false
        default: "refs/heads/main"

jobs:
  suda-sync:
    runs-on: ubuntu-latest
    # capy-inbound is always staging (ws) and uses a per-mirror group, so it never
    # shares the land lock. Land runs serialize on land-suda-main and never cancel.
    concurrency:
      group: ${{ (github.event.action || inputs.action_type) == 'capy-inbound' && format('stage-{0}', github.event.client_payload.workflow || inputs.workflow) || 'land-suda-main' }}
      cancel-in-progress: ${{ (github.event.action || inputs.action_type) == 'capy-inbound' }}
    steps:
      - name: Generate Azure-Winged Magpie App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAGPIE_APP_ID }}
          private-key: ${{ secrets.MAGPIE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Must match the capy.star destinations (plus the gosuda/0 control plane).
          repositories: |
            0
            GRT
            website
            IVNP
            HQQ
            hqq-sqlite3
            hqq-zstd
            securl
            portalite
            azure-magpie

      - name: Checkout gosuda/0 Control Plane
        uses: actions/checkout@v4
        with:
          repository: gosuda/0
          ref: refs/heads/main
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .github/scripts/capy/go.mod

      - name: Execute Monorepo Land or Inbound Sync
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_ACTION: ${{ github.event.action || inputs.action_type }}
          LAND_REF: ${{ github.event.client_payload.land_ref || inputs.land_ref }}
          WF_NAME: ${{ github.event.client_payload.workflow || inputs.workflow }}
          EXT_REF: ${{ github.event.client_payload.ref || inputs.ref || 'refs/heads/main' }}
          # Inbound is staging-only; land mode is not accepted here (it would bypass land-suda-main).
          SYNC_MODE: ws
        run: |
          git config user.name "Azure-Winged Magpie"
          git config user.email "magpie@gosuda.org"
          if [ "$EVENT_ACTION" = "capy-inbound" ]; then
            ./.github/scripts/sync-inbound.sh "$WF_NAME" "$EXT_REF" "$SYNC_MODE"
          else
            ./.github/scripts/land.sh "$LAND_REF"
          fi
